---

- name: Ensure apt prerequisites for the Docker repository
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create Docker's apt keyring directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker's official GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Get the dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_apt_arch
  changed_when: false

# Docker publishes per Ubuntu codename, so derivatives have to use
# UBUNTU_CODENAME rather than their own VERSION_CODENAME.
- name: Resolve the Ubuntu codename for the Docker repository
  ansible.builtin.shell: . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
  args:
    executable: /bin/bash
  register: docker_apt_codename
  changed_when: false

- name: Add Docker repository to Apt sources
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ docker_apt_codename.stdout }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker packages
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  notify: Run Docker hello-world

- name: Add the current user to the Docker group
  become: true
  ansible.builtin.user:
    name: "{{ remote_user }}"
    groups:
      - docker
    append: true
