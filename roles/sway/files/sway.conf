# sway config file
#
# Ported from the i3 config in roles/i3/files/i3.conf. See man 5 sway.

set $mod Mod4

font pango: Ubuntu mono 17

# Distro snippets: exports WAYLAND_DISPLAY etc. to systemd/dbus so portals
# (screen sharing) and the notification daemon can find the session.
include /etc/sway/config.d/*

# Per-machine overrides deployed by ansible (e.g. desktop.conf)
include ~/.config/sway/config.d/*

# Equivalent of "xrandr --dpi 120". Fractional scales make XWayland apps
# blurry, so only enable this if the panel needs it. List outputs with
# "swaymsg -t get_outputs".
#output eDP-1 scale 1.25

output * bg #000000 solid_color

# Keyboard: us + bulgarian phonetic, Ctrl+Alt to switch (replaces setxkbmap/ibus)
input type:keyboard {
    xkb_layout us,bg
    xkb_variant ,phonetic
    xkb_options grp:ctrl_alt_toggle
}

input type:touchpad {
    tap enabled
    dwt enabled
    natural_scroll disabled
}

# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod normal

# volume control
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle

# media keys
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# screen brightness
bindsym XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# start a terminal
bindsym $mod+Return exec kitty
# kill focused window
bindsym $mod+Shift+q kill

# program launcher (lists .desktop applications, like i3-dmenu-desktop)
bindsym $mod+d exec fuzzel

# change focus
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# alternatively, you can use the cursor keys:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# alternatively, you can use the cursor keys:
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# split in horizontal orientation
bindsym $mod+c split h

# split in vertical orientation
bindsym $mod+v split v

# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle

# change focus between tiling / floating windows
bindsym $mod+space focus mode_toggle

# focus the parent container
bindsym $mod+a focus parent

# switch to workspace
bindsym $mod+z workspace z
bindsym $mod+x workspace x
bindsym $mod+i workspace i
bindsym $mod+o workspace o
bindsym $mod+p workspace p
bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
bindsym $mod+0 workspace 10

# move focused container to workspace
bindsym $mod+Shift+z move container to workspace z
bindsym $mod+Shift+x move container to workspace x
bindsym $mod+Shift+i move container to workspace i
bindsym $mod+Shift+o move container to workspace o
bindsym $mod+Shift+p move container to workspace p
bindsym $mod+Shift+1 move container to workspace 1
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace 9
bindsym $mod+Shift+0 move container to workspace 10

#Cycle workspaces
bindsym Mod1+Tab workspace next
bindsym Mod1+Shift+Tab workspace prev
bindsym $mod+Tab workspace back_and_forth
bindsym $mod+Mod1+Right workspace next
bindsym $mod+Mod1+Left workspace prev
workspace_auto_back_and_forth yes

# reload the configuration file (sway has no in-place restart; reload covers it)
bindsym $mod+Shift+r reload
# exit sway (logs you out of your Wayland session)
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

# resize window (you can also use the mouse for that)
mode "resize" {
        bindsym h resize shrink width 5 px or 5 ppt
        bindsym j resize grow height 5 px or 5 ppt
        bindsym k resize shrink height 5 px or 5 ppt
        bindsym l resize grow width 5 px or 5 ppt

        bindsym Left resize shrink width 5 px or 5 ppt
        bindsym Down resize grow height 5 px or 5 ppt
        bindsym Up resize shrink height 5 px or 5 ppt
        bindsym Right resize grow width 5 px or 5 ppt

        # back to normal: Enter or Escape
        bindsym Return mode "default"
        bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"

# Calendar opened from the waybar clock: float it next to the clock.
# "move position mouse" only keeps it inside the output, so it would cover the
# bar (waybar sits below floating windows) and swallow the click that closes it;
# lift it above the 41px bar.
for_window [app_id="org.gnome.Calendar"] floating enable, resize set 900 700, move position mouse, move up 41 px

# Status bar (replaces i3bar + i3blocks), config in ~/.config/waybar/config
bar {
        swaybar_command waybar
}

# Polkit authentication agent
# (polkit-gnome on Ubuntu, mate-polkit on Debian)
exec sh -c 'for a in /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1 /usr/libexec/polkit-mate-authentication-agent-1; do [ -x "$a" ] && exec "$a"; done'

# Let root X11 apps (gparted via pkexec) connect to XWayland
exec xhost +SI:localuser:root

# Notifications
exec swaync
bindsym $mod+n exec swaync-client -t
bindsym $mod+Shift+n exec swaync-client -d

# Per-window keyboard layout (each window remembers its own us/bg layout)
exec swaykbdd

# Screenshots: Print = select region, Shift+Print = whole screen.
# Saved to ~/Pictures and copied to the clipboard.
bindsym Print exec sh -c 'f=~/Pictures/$(date +%F_%H-%M-%S).png; grim -g "$(slurp)" "$f" && wl-copy < "$f"'
bindsym Shift+Print exec sh -c 'f=~/Pictures/$(date +%F_%H-%M-%S).png; grim "$f" && wl-copy < "$f"'

# Idle: lock after 15 minutes, screen off shortly after, lock before suspend
# (replaces xautolock + i3lock)
exec swayidle -w \
        timeout 900 'swaylock -f -c 000000' \
        timeout 905 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
        before-sleep 'swaylock -f -c 000000'

#Bind to lock the screen
bindsym $mod+Ctrl+l exec swaylock -f -c 000000

#Autostart applications
exec nm-applet --indicator
exec blueman-applet
exec swaymsg 'workspace 3; exec pcmanfm'
