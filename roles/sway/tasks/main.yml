---

# Laptop-only tweaks below are keyed off a battery being present.
# Override with -e laptop=true / -e laptop=false.
- name: Detect a battery
  shell: ls -d /sys/class/power_supply/BAT* >/dev/null 2>&1 && echo yes || echo no
  register: battery_check
  changed_when: false

- name: Set laptop flag
  set_fact:
    is_laptop: "{{ laptop | default(battery_check.stdout == 'yes') | bool }}"

# Proprietary NVIDIA driver built for the running kernel (works before the first
# reboot into it). Override with -e nvidia=true / -e nvidia=false.
- name: Detect the NVIDIA proprietary driver
  shell: find /lib/modules/$(uname -r) -name 'nvidia*drm.ko*' | grep -q . && echo yes || echo no
  register: nvidia_check
  changed_when: false

- name: Set NVIDIA flag
  set_fact:
    has_nvidia: "{{ nvidia | default(nvidia_check.stdout == 'yes') | bool }}"

# Package names checked against noble (24.04), resolute (26.04) and Debian trixie (13).
- name: Install sway and Wayland packages
  apt:
    pkg:
      - sway
      - swaybg
      - swayidle
      - swaylock
      - xwayland
      - waybar
      - fuzzel
      - sway-notification-center
      # Per-window keyboard layout
      - swaykbdd
      - grim
      - slurp
      - wl-clipboard
      - brightnessctl
      - playerctl
      - xdg-desktop-portal-wlr
      - qtwayland5
      - qt6-wayland
      # Debian trixie dropped policykit-1-gnome; sway.conf starts whichever exists
      - "{{ 'mate-polkit' if ansible_distribution == 'Debian' else 'policykit-1-gnome' }}"
      - network-manager-gnome
      - blueman
      - pulseaudio-utils
      - lm-sensors
      # Calendar opened from the waybar clock, synced via GNOME Online Accounts
      - gnome-calendar
      - gnome-online-accounts-gtk

# brightnessctl writes /sys/class/backlight/*/brightness, which is group video
- name: Add user to video group for brightness keys
  user:
    name: "{{ remote_user }}"
    groups: video
    append: yes
  when: is_laptop

- name: Create required directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
  loop:
    - "/home/{{ remote_user }}/.config/sway"
    - "/home/{{ remote_user }}/.config/sway/config.d"
    - "/home/{{ remote_user }}/.config/waybar"
    - "/home/{{ remote_user }}/.config/fuzzel"
    # The kitty-themes clone in the base role leaves this owned by root
    - "/home/{{ remote_user }}/.config/kitty"
    - "/home/{{ remote_user }}/.config/systemd/user"

- name: Deploy sway config
  copy:
    src: files/sway.conf
    dest: "/home/{{ remote_user }}/.config/sway/config"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644

# Replaced by swaync (sway-notification-center). The sway config no longer execs
# mako, but mako-notifier ships an enabled /usr/lib/systemd/user/mako.service that
# would otherwise autostart and race swaync for the org.freedesktop.Notifications
# D-Bus name on login. Masking it the same way "systemctl --user mask" does (a
# symlink to /dev/null) avoids needing a live user D-Bus session during the run.
- name: Mask mako notification daemon
  file:
    src: /dev/null
    dest: "/home/{{ remote_user }}/.config/systemd/user/mako.service"
    state: link
    force: yes
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"

# Desktop monitor at scale 1: enlarge GTK text (Firefox, pcmanfm), like the old
# "xrandr --dpi 120" on i3. Fractional output scaling would blur XWayland apps.
# Note: dconf is shared, so this also applies in a GNOME session.
- name: Deploy desktop sway overrides
  copy:
    dest: "/home/{{ remote_user }}/.config/sway/config.d/desktop.conf"
    content: |
      # Managed by ansible (roles/sway/tasks/main.yml)
      exec_always gsettings set org.gnome.desktop.interface text-scaling-factor {{ desktop_text_scale }}
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644
  when: not is_laptop

# pcmanfm icons are fixed pixel sizes and ignore the GTK text scale.
# libfm rewrites this file when pcmanfm saves settings, so close pcmanfm first.
- name: Enlarge pcmanfm icons on desktops
  community.general.ini_file:
    path: "/home/{{ remote_user }}/.config/libfm/libfm.conf"
    section: ui
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: yes
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644
  loop: "{{ desktop_pcmanfm_icons | dict2items }}"
  when: not is_laptop

- name: Remove desktop sway overrides on laptops
  file:
    path: "/home/{{ remote_user }}/.config/sway/config.d/desktop.conf"
    state: absent
  when: is_laptop

- name: Deploy waybar config
  template:
    src: templates/waybar.jsonc.j2
    dest: "/home/{{ remote_user }}/.config/waybar/config"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644

- name: Deploy waybar style
  copy:
    src: files/waybar.css
    dest: "/home/{{ remote_user }}/.config/waybar/style.css"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644

- name: Deploy waybar calendar toggle script
  copy:
    src: files/waybar-calendar-toggle.sh
    dest: "/home/{{ remote_user }}/.config/waybar/calendar-toggle.sh"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0755

- name: Deploy waybar Wi-Fi menu script
  copy:
    src: files/waybar-wifi-menu.sh
    dest: "/home/{{ remote_user }}/.config/waybar/wifi-menu.sh"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0755

- name: Deploy fuzzel config
  copy:
    src: files/fuzzel.ini
    dest: "/home/{{ remote_user }}/.config/fuzzel/fuzzel.ini"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644

# GNOME Settings refuses to run outside GNOME and is hidden from fuzzel there:
# a PATH wrapper plus a launcher entry without OnlyShowIn=GNOME.
- name: Create user bin and applications directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
  loop:
    - "/home/{{ remote_user }}/.local/bin"
    - "/home/{{ remote_user }}/.local/share/applications"

- name: Deploy gnome-control-center wrapper
  copy:
    src: files/gnome-control-center.sh
    dest: "/home/{{ remote_user }}/.local/bin/gnome-control-center"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0755

- name: Deploy GNOME Settings launcher entry
  copy:
    src: files/org.gnome.Settings.desktop
    dest: "/home/{{ remote_user }}/.local/share/applications/org.gnome.Settings.desktop"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644

# Larger font instead of a fractional output scale, which blurs kitty's text.
# Only ansible's marked block is managed, so the theme block that
# "kitty +kitten themes" writes into kitty.conf survives.
- name: Deploy kitty config
  blockinfile:
    path: "/home/{{ remote_user }}/.config/kitty/kitty.conf"
    block: "{{ lookup('file', 'kitty.conf') }}"
    insertbefore: BOF
    create: yes
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644

# Default kitty theme (Monokai). Not overwritten once present, so a theme picked
# locally with "kitty +kitten themes" is kept.
- name: Deploy default kitty theme
  copy:
    src: files/kitty-theme.conf
    dest: "/home/{{ remote_user }}/.config/kitty/current-theme.conf"
    force: no
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    mode: 0644

- name: Load kitty theme
  lineinfile:
    path: "/home/{{ remote_user }}/.config/kitty/kitty.conf"
    regexp: '^include current-theme\.conf'
    line: include current-theme.conf

- name: NVIDIA support
  import_tasks: nvidia.yml
  when: has_nvidia

# Battery: no modem in these laptops, and network printer discovery isn't needed
- name: Mask ModemManager
  systemd:
    name: ModemManager
    enabled: no
    state: stopped
    masked: yes
  when: is_laptop

- name: Disable cups-browsed
  systemd:
    name: cups-browsed
    enabled: no
    state: stopped
  when: is_laptop

# On battery: dim the backlight on dark content and let the GPU idle lower.
# Skipped on machines whose power-profiles-daemon doesn't offer the action.
- name: Enable power-profiles-daemon AMD power saving actions
  shell: |
    actions=$(powerprofilesctl list-actions)
    echo "$actions" | grep -q "^Name: {{ item }}$" || exit 0
    echo "$actions" | grep -A2 "^Name: {{ item }}$" | grep -q "Enabled: True" && exit 0
    powerprofilesctl configure-action {{ item }} --enable && echo changed
  register: ppd_action
  changed_when: "'changed' in ppd_action.stdout"
  when: is_laptop
  loop:
    - amdgpu_panel_power
    - amdgpu_dpm

# Bluetooth stays powered off after boot until turned on from blueman.
# Takes effect on next boot (no restart, so live connections aren't dropped).
- name: Keep bluetooth off at boot
  lineinfile:
    path: /etc/bluetooth/main.conf
    regexp: '^#?AutoEnable='
    line: AutoEnable=false
    insertafter: '^\[Policy\]'
  when: is_laptop

# Stop charging at 80%, resume below 75%, to slow battery wear.
# Skipped on batteries without charge threshold support.
# ACTION=="add" only: writing the thresholds makes the EC emit a battery
# "change" event, so matching every event loops forever and hangs ACPI.
- name: Check battery charge threshold support
  stat:
    path: /sys/class/power_supply/BAT0/charge_control_end_threshold
  register: charge_threshold
  when: is_laptop

- name: Deploy battery charge limit udev rule
  copy:
    dest: /etc/udev/rules.d/99-battery-charge-limit.rules
    content: |
      ACTION=="add", SUBSYSTEM=="power_supply", KERNEL=="BAT0", ATTR{charge_control_end_threshold}="80", ATTR{charge_control_start_threshold}="75"
    mode: 0644
  register: charge_rule
  when: is_laptop and charge_threshold.stat.exists

- name: Apply battery charge limit now
  shell: |
    echo 80 > /sys/class/power_supply/BAT0/charge_control_end_threshold
    echo 75 > /sys/class/power_supply/BAT0/charge_control_start_threshold
  when: charge_rule is changed
