---
nc_data_path: /mnt/ncloud/owncloud
nc_db_path: /var/lib/mysql
nc_config_path: /var/www/nextcloud/config

# --- znc ---------------------------------------------------------------------

znc_datadir: /var/lib/znc
znc_user: _znc
znc_group: _znc
znc_vault_conf: "{{ playbook_dir }}/ansible-vault/znc.conf"
znc_vault_pem: "{{ playbook_dir }}/ansible-vault/znc.pem"

# --- portainer -------------------------------------------------------------

# Must be tagged. Portainer stopped moving :latest
portainer_image: portainer/portainer-ce:lts

# --- minidlna --------------------------------------------------------------

minidlna_image: vladgh/minidlna:latest
minidlna_friendly_name: MiniDLNA
minidlna_media_path: /mnt/data/media
minidlna_port: 8200
minidlna_cache_volume: minidlna-cache

# --- dynamic dns -----------------------------------------------------------

cf_dns_script: /usr/local/sbin/cf-dns-update.sh
cf_dns_envfile: /root/.config/cf-dns/env
cf_dns_service: cf-dns-update
cf_dns_interval: 10min
cf_dns_boot_delay: 2min
cf_dns_ip_endpoints:
  - https://checkip.amazonaws.com
  - https://api.ipify.org
  - https://ifconfig.me/ip
# Short, because the whole point is that the address can change under us.
cf_dns_ttl: 300
#
# Identifying values live in ansible-vault/secrets.txt and are deliberately NOT
# defaulted here - role vars outrank the play's vars_files, so a copy in this
# file would silently shadow the vault. Expected from the vault:
#   cloudflare_api_token   API token with Zone:Read + DNS:Edit on the zones
#   cf_dns_a_records       list of {zone, name} pinned to the WAN address;
#                          name '@' is the zone apex

# --- mailcow tls -----------------------------------------------------------

# certbot owns the certificate; mailcow stays on SKIP_LETS_ENCRYPT=y and is fed
# by the deploy hook. See roles/server/tasks/mailcow-certs.yml.
# From the vault (see the shadowing note under dynamic dns):
#   mail_dns_domain        the domain mailcow sends and receives for
mailcow_root: /opt/mailcow-dockerized
mailcow_ssl_dir: "{{ mailcow_root }}/data/assets/ssl"
mailcow_webroot: /var/www/html
mailcow_upstream: 127.0.0.1:8080
mailcow_cert_hook: /etc/letsencrypt/renewal-hooks/deploy/mailcow.sh
# These read the domain from the vault at run time, so nothing identifying is
# committed here.
mailcow_hostname: "mail.{{ mail_dns_domain }}"
mailcow_cert_names:
  - "mail.{{ mail_dns_domain }}"
  - "autodiscover.{{ mail_dns_domain }}"
  - "autoconfig.{{ mail_dns_domain }}"
mailcow_cert_live: "/etc/letsencrypt/live/{{ mailcow_hostname }}"
# Only the services that actually read cert.pem - restarting the whole stack
# would be a needless outage on every renewal.
mailcow_reload_services: "postfix-mailcow dovecot-mailcow nginx-mailcow"

# --- local mirror ----------------------------------------------------------

# Second on-disk copy of the Nextcloud data, sda1 -> sdc1
ncloud_mirror_script: /usr/local/sbin/ncloud-mirror.sh
ncloud_mirror_src: /mnt/ncloud/owncloud
ncloud_mirror_src_mount: /mnt/ncloud
ncloud_mirror_dest_mount: /mnt/backups
ncloud_mirror_root: /mnt/backups/ncloud
ncloud_mirror_live: "{{ ncloud_mirror_root }}/live"
ncloud_mirror_snapdir: "{{ ncloud_mirror_root }}/.snapshots"
ncloud_mirror_oncalendar: "Sun *-*-* 01:00:00"
# Weekly runs, so 4 snapshots is 4 weeks of history.
ncloud_mirror_keep: 4
ncloud_mirror_timer_enabled: true
# Circuit breaker. A normal week deletes a handful of files; thousands means the
# source lost data, and replaying that onto the mirror is the thing to prevent.
ncloud_mirror_max_delete: 5000
ncloud_mirror_min_source_gb: 900
ncloud_mirror_min_entries: 5
# Regenerable caches, excluded because walking them is expensive and not needed
ncloud_mirror_excludes:
  - "/appdata_*/preview/"
  - "/updater-*/"

# --- backups ---------------------------------------------------------------

# Weekly DB dump. Lands on sdc, deliberately not on sda1 where the data it
# protects lives.
nc_sqldump_script: /usr/local/sbin/nextcloud-sqldump.sh
nc_sqldump_db: nextcloud
nc_sqldump_dir: /mnt/backups/mysql
nc_sqldump_mount: /mnt/backups
nc_sqldump_keep: 8
nc_sqldump_min_mb: 10
nc_sqldump_gzip_level: 9
nc_sqldump_oncalendar: "Tue *-*-* 04:02:00"

# --- rclone / glacier ------------------------------------------------------

# Off-site cold copy in S3 Glacier Deep Archive. See roles/server/tasks/rclone.yml.
rclone_version: v1.76.0
rclone_bin: /usr/local/bin/rclone
rclone_config: /root/.config/rclone/rclone.conf
# From the vault (see the shadowing note under dynamic dns):
#   rclone_s3_bucket, rclone_s3_region,
#   rclone_s3_access_key_id, rclone_s3_secret_access_key,
#   rclone_crypt_password  - the only key to the data; keep an offline copy

glacier_script: /usr/local/sbin/glacier-backup.sh
glacier_src_mount: /mnt/ncloud
glacier_jobs:
  - { src: /mnt/ncloud/owncloud, dest: nextcloud, prune: true }
  # DB dumps were never in the B2 backup; without them a restore loses shares,
  # tags and metadata. ~50 small files a year. Not pruned: the local rotation
  # keeps only 8 weeks, so this is the only long history of the database.
  - { src: /mnt/backups/mysql, dest: mysql, prune: false }
# Ported from /root/.duplicacy/filters (2026-11-11). rclone syntax: leading /
# anchors at the data root; "dir/**" excludes a directory's contents, a pattern
# without /** matches files only. Per-user paths are identifying -> vault, as
# glacier_vault_excludes (list).
# Deliberately NOT carried over from duplicacy:
#   appdata*  - only previews are excluded; the rest holds the instance signing
#               keypair (identityproof), avatars and theming, which do not regenerate
#   .ocdata   - excluding it makes a restored data dir refuse to start
#   oc*       - too broad (would catch any user whose name starts with "oc");
#               replaced by the four explicit Nextcloud entries below
glacier_excludes:
  # Nextcloud code: reinstall the same version instead. Each upgrade replaces
  # thousands of these files, which would also trip glacier_prune_max.
  - "/3rdparty/**"
  - "/apps*/**"
  - "/core/**"
  - "/dist/**"
  - "/themes/**"
  - "/updater*/**"
  - "/ocs/**"
  - "/ocs-provider/**"
  - "/ocm-provider/**"
  - "/occ"
  - "/composer*"
  - "/package*"
  - "/.htaccess"
  - "/lib/**"
  - "/resources/**"
  - "/custom_apps/**"     # app-store apps; reinstalled from the store
  - "/LICENSES/**"
  - "/.reuse/**"
  - "/.user.ini"
  - "/AUTHORS"
  - "/COPYING"
  - "/index.html"
  - "/robots.txt"
  - "/console.php"
  - "/cron.php"
  - "/index.php"
  - "/public.php"
  - "/remote.php"
  - "/status.php"
  # version.php is kept on purpose: it names the exact release to reinstall.
  # Regenerable or transient
  - "/.duplicacy/**"      # leftover duplicacy dir in the data root
  - "/*.lock"
  - "/appdata_*/preview/**"
  - "/cache*/**"
  - "/.locks*/**"
  - "/files_external*/**"
  - "/*/cache/**"
  - "/*/uploads/**"
  # Per-user version history and trash bin: Nextcloud expires them itself, so
  # backing them up just feeds the prune.
  - "/*/files_versions/**"
  - "/*/files_trashbin/**"
  # Logs: rewritten constantly, so each run would re-upload them.
  - "/audit*"
  - "/*.log"
glacier_transfers: 4
glacier_checkers: 8
# rclone --bwlimit syntax, e.g. "08:00,4M 23:00,off" to keep daytime upload
# usable. Empty = unlimited.
glacier_bwlimit: ""
glacier_stats_interval: 15m
# Thu: clear of the Tue sqldump and Sun mirror.
glacier_oncalendar: "Thu *-*-* 02:30:00"
glacier_timer_enabled: false
# Prune deletes a bucket file only when it was uploaded >= min_age days ago (so
# the 180-day Deep Archive minimum is paid) AND has been missing locally for
# >= grace days. More than prune_max candidates in one run aborts the prune.
glacier_prune_min_age_days: 181
glacier_prune_grace_days: 60
glacier_prune_max: 2000
glacier_state_dir: /var/lib/glacier-backup
