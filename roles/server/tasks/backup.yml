---


- name: Install the Nextcloud SQL dump script
  become: true
  template:
    src: "files/nextcloud-sqldump.sh.j2"
    dest: "{{ nc_sqldump_script }}"
    owner: root
    group: root
    mode: '0750'

- name: Install the Nextcloud SQL dump service unit
  become: true
  copy:
    dest: /etc/systemd/system/nextcloud-sqldump.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Weekly Nextcloud database dump
      After=mariadb.service {{ nc_sqldump_mount | regex_replace('^/', '') | regex_replace('/', '-') }}.mount

      [Service]
      Type=oneshot
      ExecStart={{ nc_sqldump_script }}
      Nice=10
      IOSchedulingClass=idle
  notify: Reload systemd

- name: Install the Nextcloud SQL dump timer unit
  become: true
  copy:
    dest: /etc/systemd/system/nextcloud-sqldump.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Weekly Nextcloud database dump

      [Timer]
      OnCalendar={{ nc_sqldump_oncalendar }}
      Persistent=true
      RandomizedDelaySec=15m

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

# Skipped under --check: the unit file is not on disk in check mode, so systemd
# would fail looking it up and abort the rest of the dry run.
- name: Enable the Nextcloud SQL dump timer
  become: true
  systemd:
    name: nextcloud-sqldump.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

# --- retire duplicacy / Backblaze B2 (2026-11-11) ----------------------------
# Off-site backup moved to S3 Glacier Deep Archive (rclone.yml). The B2 bucket
# is kept as-is; only the jobs and the on-disk credentials go. /root/duplicacy
# and /root/.duplicacy (preferences, filters) are left so the B2 snapshots can
# still be restored by hand. Safe to delete this block once it has run.

- name: Stop and disable the duplicacy timers and services
  become: true
  systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - duplicacy-nextcloud.timer
    - duplicacy-nextcloud-prune.timer
    - duplicacy-nextcloud.service
    - duplicacy-nextcloud-prune.service
  failed_when: false
  when: not ansible_check_mode

- name: Remove the duplicacy units, script and B2 credentials
  become: true
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/duplicacy-nextcloud.timer
    - /etc/systemd/system/duplicacy-nextcloud.service
    - /etc/systemd/system/duplicacy-nextcloud-prune.timer
    - /etc/systemd/system/duplicacy-nextcloud-prune.service
    - /usr/local/sbin/duplicacy-backup.sh
    - /root/.duplicacy/env
  notify: Reload systemd
