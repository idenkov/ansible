---

# apt_repository's ppa: shorthand is broken without apt-key (it runs `gpg --export`
# without ever fetching the key), so define the PPA explicitly.
- name: Add repos
  deb822_repository:
    name: strawberry
    types: deb
    uris: 'https://ppa.launchpadcontent.net/jonaski/strawberry/ubuntu'
    suites: '{{ ansible_distribution_release }}'
    components: main
    signed_by: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xBE5ED0F9261CAAD9A1E5B1A4CD6289E999EA819D'
  # Ubuntu-only PPA; Debian ships strawberry in main
  when: personal | bool and ansible_distribution == 'Ubuntu'

- name: Get the non root remote user                                                                                           
  set_fact:
    remote_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

- name: Include packages
  import_tasks: "packages.yml"

- name: Vim config
  import_tasks: "vim.yml"

# Takes effect at next login
- name: Generate time locale
  community.general.locale_gen:
    name: "{{ lc_time }}"
    state: present

- name: Set time locale (first day of week, date format)
  lineinfile:
    path: /etc/default/locale
    regexp: '^LC_TIME='
    line: 'LC_TIME="{{ lc_time }}"'
    create: yes

- name: env variable for kitty janky ssh behaviour
  lineinfile:
    path: "/home/{{ remote_user }}/.bashrc"
    line: 'export TERM="xterm-256color"'
    create: no
    state: present
    insertafter: EOF

- name: Bash prompt
  import_tasks: "prompt.yml"

- name: Clone kitty themes repository
  git:
    repo: 'https://github.com/dexpota/kitty-themes.git'
    dest: "/home/{{ remote_user }}/.config/kitty/kitty-themes"
    depth: 1
    clone: yes
    update: no

- name: Apply kitty theme
  file:
    src: "/home/{{ remote_user }}/.config/kitty/kitty-themes/themes/Misterioso.conf"
    dest: "/home/{{ remote_user }}/.config/kitty/theme.conf"
    state: link
    force: yes
